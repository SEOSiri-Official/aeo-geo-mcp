name: AEO GEO MCP Test Suite
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Build & Package Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel pytest requests mcp fastapi uvicorn
          pip install -e .
          
      - name: Run Test Suite
        run: python -m pytest tests/test_aeo_geo.py