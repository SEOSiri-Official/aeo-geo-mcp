[project]
name = "seosiri-aeo-geo-mcp"
version = "1.0.0"
description = "A sovereign, local-first MCP server for AI Engine Optimization (AEO), Generative Engine Optimization (GEO), LLM.txt validation, and content stickiness analytics."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "SEOSiri-Official", email = "info@seosiri.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Security"
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "requests>=2.28.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.31.1"
]

[project.urls]
Homepage = "https://www.seosiri.com/2026/07/aeo-geo-mcp.html"
Repository = "https://www.seosiri.com/2026/07/aeo-geo-mcp.html.git"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
